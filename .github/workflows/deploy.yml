name: Deploy

# Manual trigger only — no auto-deploy on push.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment (which GitHub Environment's vars/secrets + host to deploy to)"
        # "environment" type renders a dropdown of the repo's configured
        # GitHub Environments (e.g. production, testing).
        type: environment
        required: true

concurrency:
  # Per-environment, so a testing deploy never blocks a production one.
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    # One shared runner serves every environment: it no longer hosts the app, it
    # only ships the source to the target VM and drives docker compose there over
    # SSH. Register it under Settings -> Actions -> Runners with the label
    # "deploy-runner".
    runs-on: [self-hosted, deploy-runner]

    # Scopes vars.*/secrets.* (and protection rules) to the chosen environment.
    environment: ${{ inputs.environment }}

    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER || 'deploy' }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
      # Build context on the app VM. Relative paths resolve against the deploy
      # user's home, so no root-owned directory has to be prepared. It is wiped
      # and re-extracted on every deploy — all state lives in the named volumes.
      DEPLOY_DIR: ${{ vars.DEPLOY_DIR || 'svconcat/app' }}
      # Explicit project name so volume names stay svconcat_umbraco-{data,media}
      # no matter which directory the compose file is deployed into.
      COMPOSE_PROJECT_NAME: svconcat

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve runtime environment
        shell: bash
        # Map the GitHub Environment name to ASPNETCORE_ENVIRONMENT, capitalizing
        # the first letter (testing -> Testing, production -> Production). Set via
        # $GITHUB_ENV so later steps see it.
        run: |
          env_in="${{ inputs.environment }}"
          aspnet="$(printf '%s' "${env_in:0:1}" | tr '[:lower:]' '[:upper:]')${env_in:1}"
          echo "ASPNETCORE_ENVIRONMENT=$aspnet" >> "$GITHUB_ENV"
          echo "Deploying to '$env_in' (ASPNETCORE_ENVIRONMENT=$aspnet)"

      - name: Validate deployment config
        shell: bash
        # Fail fast with a clear message instead of letting the SSH step or
        # Umbraco's boot crash-loop explain it. Values are never echoed (this
        # repo is public -> logs are public).
        env:
          ADMIN_EMAIL: ${{ secrets.UMBRACO_ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.UMBRACO_ADMIN_PASSWORD }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          fail=0
          env_name="${{ inputs.environment }}"
          if [[ -z "${DEPLOY_HOST}" ]]; then
            echo "::error::Variable DEPLOY_HOST is empty for the '${env_name}' environment. Add the app VM's hostname/IP under Settings -> Environments -> ${env_name} -> Environment *variables*."
            fail=1
          fi
          if [[ -z "${SSH_KEY}" ]]; then
            echo "::error::Secret DEPLOY_SSH_KEY is empty for the '${env_name}' environment. Add the private key whose public half is in ${DEPLOY_USER:-deploy}'s authorized_keys on the app VM."
            fail=1
          fi
          if [[ -z "${ADMIN_EMAIL}" ]]; then
            echo "::error::Secret UMBRACO_ADMIN_EMAIL is empty for the '${env_name}' environment."
            fail=1
          elif [[ "${ADMIN_EMAIL}" != *@*.* ]]; then
            echo "::error::UMBRACO_ADMIN_EMAIL is not a valid email address."
            fail=1
          fi
          if [[ -z "${ADMIN_PASSWORD}" ]]; then
            echo "::error::Secret UMBRACO_ADMIN_PASSWORD is empty for the '${env_name}' environment."
            fail=1
          fi
          [[ "$fail" -eq 0 ]] && echo "Deployment config OK." || exit 1

      - name: Configure SSH
        shell: bash
        # The key lives only in $RUNNER_TEMP (wiped by the cleanup step) because
        # the runner is long-lived and shared between environments.
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          ssh_dir="$RUNNER_TEMP/ssh"
          mkdir -p "$ssh_dir"
          chmod 700 "$ssh_dir"
          printf '%s\n' "$SSH_KEY" > "$ssh_dir/id"
          chmod 600 "$ssh_dir/id"
          if [[ -n "$KNOWN_HOSTS" ]]; then
            printf '%s\n' "$KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          fi
          if [[ -z "$KNOWN_HOSTS" ]]; then
            echo "::warning::DEPLOY_KNOWN_HOSTS is not set, so the host key is taken from ssh-keyscan and not verified. Add 'ssh-keyscan -p $DEPLOY_PORT $DEPLOY_HOST' output as an environment variable to close the MITM window."
            ssh-keyscan -p "$DEPLOY_PORT" "$DEPLOY_HOST" > "$ssh_dir/known_hosts" 2>/dev/null
          fi
          chmod 600 "$ssh_dir/known_hosts"
          # Word-split on purpose where used: these are ssh flags, not one arg.
          echo "SSH_OPTS=-i $ssh_dir/id -o IdentitiesOnly=yes -o UserKnownHostsFile=$ssh_dir/known_hosts -o StrictHostKeyChecking=yes -o BatchMode=yes -p $DEPLOY_PORT" >> "$GITHUB_ENV"
          echo "DEPLOY_TARGET=$DEPLOY_USER@$DEPLOY_HOST" >> "$GITHUB_ENV"

      - name: Ship source to the app VM
        shell: bash
        # git archive sends exactly the tracked files at this commit (no .git, no
        # runner-local junk). The directory is recreated from scratch so a file
        # deleted in git can never linger in the build context.
        run: |
          # Prove SSH works and compose v2 is present before wiping anything.
          ssh $SSH_OPTS "$DEPLOY_TARGET" "docker compose version" > /dev/null
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/src.tgz"
          ssh $SSH_OPTS "$DEPLOY_TARGET" \
            "rm -rf '$DEPLOY_DIR' && mkdir -p '$DEPLOY_DIR' && tar -xzf - -C '$DEPLOY_DIR'" \
            < "$RUNNER_TEMP/src.tgz"

      - name: Build & deploy on the app VM
        shell: bash
        # Secrets travel base64-encoded inside the script on stdin: base64 is
        # shell-safe (a "$" in the password survives untouched, which is the same
        # reason compose uses pass-through env keys) and stdin keeps them out of
        # the remote process list, unlike ssh arguments.
        # UseHttps stays true so the backoffice enforces HTTPS via the proxy's
        # forwarded scheme.
        env:
          ADMIN_NAME: ${{ secrets.UMBRACO_ADMIN_NAME || 'Administrator' }}
          ADMIN_EMAIL: ${{ secrets.UMBRACO_ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.UMBRACO_ADMIN_PASSWORD }}
        run: |
          name_b64="$(printf '%s' "$ADMIN_NAME" | base64 | tr -d '\n')"
          email_b64="$(printf '%s' "$ADMIN_EMAIL" | base64 | tr -d '\n')"
          pass_b64="$(printf '%s' "$ADMIN_PASSWORD" | base64 | tr -d '\n')"
          # --wait blocks until the container reports healthy (per the compose
          # healthcheck) and fails the job if it doesn't within the timeout. A
          # failed build leaves the running container untouched.
          ssh $SSH_OPTS "$DEPLOY_TARGET" sh -s <<EOF
          set -eu
          cd '$DEPLOY_DIR'
          export COMPOSE_PROJECT_NAME='$COMPOSE_PROJECT_NAME'
          export ASPNETCORE_ENVIRONMENT='$ASPNETCORE_ENVIRONMENT'
          export UMBRACO_USE_HTTPS='true'
          export Umbraco__CMS__Unattended__UnattendedUserName="\$(printf '%s' '$name_b64' | base64 -d)"
          export Umbraco__CMS__Unattended__UnattendedUserEmail="\$(printf '%s' '$email_b64' | base64 -d)"
          export Umbraco__CMS__Unattended__UnattendedUserPassword="\$(printf '%s' '$pass_b64' | base64 -d)"
          docker compose up -d --build --remove-orphans --wait --wait-timeout 240
          EOF

      - name: Smoke test
        shell: bash
        # Explicit readable gate on top of the healthcheck. Run from inside the
        # container so the Alpine host needs no curl of its own.
        run: |
          ssh $SSH_OPTS "$DEPLOY_TARGET" sh -s <<EOF
          set -eu
          cd '$DEPLOY_DIR'
          export COMPOSE_PROJECT_NAME='$COMPOSE_PROJECT_NAME'
          docker compose exec -T web curl -fsS -o /dev/null http://localhost:8080/
          docker compose exec -T web curl -fsS -o /dev/null http://localhost:8080/umbraco
          EOF
          echo "Smoke test passed."

      - name: Verify public URL
        # Optional: catches a healthy container that the reverse proxy or TLS in
        # front of it is not actually serving.
        if: vars.DEPLOY_PUBLIC_URL != ''
        shell: bash
        run: |
          curl -fsS --retry 3 --retry-delay 5 -o /dev/null "${{ vars.DEPLOY_PUBLIC_URL }}"
          echo "Public URL reachable."

      - name: Dump diagnostics on failure
        if: failure() && env.SSH_OPTS != ''
        shell: bash
        run: |
          ssh $SSH_OPTS "$DEPLOY_TARGET" sh -s <<EOF
          cd '$DEPLOY_DIR' || exit 0
          export COMPOSE_PROJECT_NAME='$COMPOSE_PROJECT_NAME'
          echo "::group::docker compose ps"
          docker compose ps
          echo "::endgroup::"
          echo "::group::container logs (last 200 lines)"
          docker compose logs --no-color --tail=200
          echo "::endgroup::"
          EOF

      - name: Prune dangling images on the app VM
        if: always() && env.SSH_OPTS != ''
        shell: bash
        # Building on the app VM leaves SDK/node layers behind; without this the
        # small Alpine disks fill up after a handful of deploys.
        run: ssh $SSH_OPTS "$DEPLOY_TARGET" "docker image prune -f"

      - name: Remove SSH credentials
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/ssh" "$RUNNER_TEMP/src.tgz"
